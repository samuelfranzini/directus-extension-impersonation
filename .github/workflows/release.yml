name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags for the changelog

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # No dependency lifecycle script may run in the job holding the release credentials
      - run: npm ci --ignore-scripts
      - run: npm run build

      # The archive unpacks to a folder to drop into the Directus `extensions` directory
      - name: Package the extension
        run: |
          NAME="$(node -p "require('./package.json').name")"
          mkdir -p "release/$NAME"
          cp package.json "release/$NAME/"
          cp -r dist "release/$NAME/"
          (cd release && zip -r "../$NAME-$GITHUB_REF_NAME.zip" "$NAME")

      - name: Generate release notes
        run: npx git-cliff --latest --strip header -o RELEASE_NOTES.md

      - name: Create GitHub release
        run: |
          # v1.2.3-beta.1 -> prerelease
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md $PRERELEASE --verify-tag ./*.zip
        env:
          GH_TOKEN: ${{ github.token }}

      # Authenticated through OIDC (trusted publisher configured on npmjs.com), no stored token
      - name: Publish to npm
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm, skipping"
            exit 0
          fi
          TAG=""
          case "$VERSION" in *-*) TAG="--tag next" ;; esac
          npm publish $TAG
